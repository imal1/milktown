<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #E7E4DC; color: #322E28; -webkit-font-smoothing: antialiased; }
  a { color: #3E5C86; text-decoration: none; }
  a:hover { color: #2C4468; text-decoration: underline; }
  [contenteditable]:focus { outline: none; }
</style>
</helmet>

<div style="min-height: 100vh; padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 22px; font-family: 'Source Serif 4', 'Songti SC', serif;">

  <div style="width: 800px; display: flex; flex-direction: column; gap: 3px;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8378;">Milktown · 1c 克制 · 可交互原型</div>
    <div style="font-size: 15px; color: #5C564C;">在窗口里直接写。⌘S 保存 · ⌘N 新建 · ⌘O 最近文件 · ⌘1–4 直开 · Esc 关闭</div>
  </div>

  <div style="width: 800px; height: 600px; border-radius: 11px; overflow: hidden; position: relative; display: flex; flex-direction: column; flex: none; background: #FDFCF9; box-shadow: 0 26px 60px -24px rgba(40,34,26,0.45), 0 0 0 1px rgba(40,34,26,0.10);" data-screen-label="1c 原型窗口">

    <div style="height: 34px; flex: none; display: flex; align-items: center; padding: 0 13px; gap: 12px; border-bottom: 1px solid #EEEAE0;">
      <div style="display: flex; gap: 8px;">
        <div style="width: 10px; height: 10px; border-radius: 50%; background: #DFD9CC;"></div>
        <div style="width: 10px; height: 10px; border-radius: 50%; background: #DFD9CC;"></div>
        <div style="width: 10px; height: 10px; border-radius: 50%; background: #DFD9CC;"></div>
      </div>
      <div style="flex: 1; display: flex; justify-content: center;">
        <button onClick="{{ toggleRecent }}" style="{{ titleBtn }}">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px;">{{ fileNameStar }}</span>
          <span style="font-size: 9px; color: #A39B8E;">▾</span>
        </button>
      </div>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A39B8E;">{{ words }}</span>
    </div>

    <div style="flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: center; padding: 48px 40px 0;">
      <div style="{{ sheetStyle }}">
        <sc-if value="{{ showEmpty }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; padding-bottom: 26px;">
            <div style="display: flex; align-items: center; gap: 2px; margin-bottom: 34px;">
              <span style="font-size: 27px; font-weight: 600; color: #C9C2B4;">开始写</span>
              <span style="width: 2px; height: 29px; background: #2E2A24;"></span>
            </div>
            <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #A39B8E; margin-bottom: 12px;">最近文件</div>
            <div style="display: flex; flex-direction: column; border-top: 1px solid #EEEAE0;">
              <sc-for list="{{ recent }}" as="f" hint-placeholder-count="4">
                <button onClick="{{ f.open }}" style="{{ f.rowStyle }}">
                  <span style="font-size: 16px;">{{ f.name }}</span>
                  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A39B8E;">{{ f.meta }}</span>
                </button>
              </sc-for>
            </div>
          </div>
        </sc-if>
        <div contentEditable="{{ editable }}" suppressContentEditableWarning="{{ true }}" onInput="{{ onInput }}" ref="{{ docRef }}" style="{{ proseStyle }}"></div>
      </div>
    </div>

    <sc-if value="{{ showRecent }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ closeRecent }}" style="position: absolute; inset: 0; background: rgba(253,252,249,0.45); z-index: 8;"></div>
      <div style="position: absolute; top: 36px; left: 50%; transform: translateX(-50%); width: 360px; z-index: 9; background: #FFFEFB; border: 1px solid rgba(40,34,26,0.10); border-radius: 7px; box-shadow: 0 14px 34px -12px rgba(40,34,26,0.35); overflow: hidden;">
        <div style="padding: 9px 14px 6px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #A39B8E;">最近文件</div>
        <div style="padding: 5px;">
          <sc-for list="{{ recent }}" as="f" hint-placeholder-count="4">
            <button onClick="{{ f.open }}" onMouseEnter="{{ f.hover }}" style="{{ f.panelRowStyle }}">
              <span style="{{ f.panelNameStyle }}">{{ f.name }}</span>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A39B8E;">{{ f.meta }}</span>
            </button>
          </sc-for>
        </div>
        <div style="padding: 9px 15px; border-top: 1px solid #F2EEE4; display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #B4AC9F;">
          <span>↵ 打开 · ↑↓ 选择</span><span>⌘O 其他…</span>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ showToast }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10; padding: 7px 14px; border-radius: 6px; background: rgba(46,42,36,0.90); color: #F7F4EC; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; white-space: nowrap;">{{ toastText }}</div>
    </sc-if>
  </div>

  <div style="width: 800px; display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8A8378;">
    <span>点文件名展开最近文件 · 脏状态沿用 *</span>
    <span>行宽 {{ measure }}ch · 正文 {{ bodySize }}px</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:880,&quot;height&quot;:740},&quot;measure&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:48,&quot;max&quot;:88,&quot;step&quot;:2,&quot;default&quot;:66,&quot;unit&quot;:&quot;ch&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;排版&quot;},&quot;bodySize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:15,&quot;max&quot;:21,&quot;step&quot;:1,&quot;default&quot;:18,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;排版&quot;},&quot;dirtyMark&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;*&quot;,&quot;•&quot;,&quot;·&quot;,&quot;未保存&quot;],&quot;default&quot;:&quot;*&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;状态&quot;}}">
const SEED = (title) => `<h1 style="font-size:1.5em;font-weight:600;line-height:1.32;margin:0 0 .7em;letter-spacing:-0.012em">${title}</h1><p style="margin:0 0 .85em">工具栏上的每个按钮都在偷高度。四个操作都有快捷键，那条横栏留在屏幕上的唯一理由，是让我确认文件还在。</p><blockquote style="margin:0 0 .85em;padding-left:20px;border-left:2px solid #E2DCCE;color:#6E675C">一个自用的编辑器，验收标准只有一条：作者今天愿意用它写东西吗。</blockquote><pre style="margin:0 0 .95em;font-family:'IBM Plex Mono',monospace;font-size:.75em;line-height:1.7;border-top:1px solid #EEEAE0;border-bottom:1px solid #EEEAE0;padding:12px 0;color:#4A443B">$ milktown ~/notes/2026-09.md</pre><table style="border-collapse:collapse;width:100%;font-size:.85em"><tbody><tr><td style="padding:8px 0;border-bottom:1px solid #E7E2D6;font-family:'IBM Plex Mono',monospace;font-size:.8em;letter-spacing:.1em;color:#A39B8E">操作</td><td style="padding:8px 0;border-bottom:1px solid #E7E2D6;font-family:'IBM Plex Mono',monospace;font-size:.8em;letter-spacing:.1em;color:#A39B8E;width:100px">键</td></tr><tr><td style="padding:8px 0;border-bottom:1px solid #F2EEE4">保存</td><td style="padding:8px 0;border-bottom:1px solid #F2EEE4;font-family:'IBM Plex Mono',monospace">⌘S</td></tr><tr><td style="padding:8px 0">另存为</td><td style="padding:8px 0;font-family:'IBM Plex Mono',monospace">⇧⌘S</td></tr></tbody></table><p style="margin:.2em 0 0"><br></p>`;

const FILES = [
  { name: '2026-09.md', dir: '~/notes', meta: '~/notes · 2 小时前', path: '~/notes/2026-09.md', title: '写作工具的一点想法' },
  { name: '0002 编辑器持有文档.md', dir: '~/milktown/docs/adr', meta: '…/docs/adr · 昨天', path: '~/milktown/docs/adr/0002-editor-owns-the-document.md', title: '编辑器持有文档' },
  { name: '交接.md', dir: '~/milktown', meta: '~/milktown · 上周', path: '~/milktown/交接.md', title: 'UI 设计会话交接' },
  { name: '2026-08.md', dir: '~/notes', meta: '~/notes · 8 月', path: '~/notes/2026-08.md', title: '八月' }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this._pending = SEED(FILES[0].title);
    this.docRef = (el) => { if (el) { this._docEl = el; this.applySeed(); } };
    this.state = { fileIdx: 0, dirty: false, words: 0, recentOpen: false, sel: 0, toast: null, seedKey: 'init' };
  }

  componentDidMount() { this.applySeed(); document.addEventListener('keydown', this.onKey); }
  componentWillUnmount() { document.removeEventListener('keydown', this.onKey); clearTimeout(this._t); }
  componentDidUpdate(_, prev) { this.applySeed(prev.seedKey !== this.state.seedKey); }

  seed(title) { this._pending = title === null ? '<p><br></p>' : SEED(title); this.setState({ seedKey: String(Date.now()) }); }
  applySeed(force) {
    const el = this._docEl;
    if (!el || this._pending == null) return;
    if (!force && (this._touched || (el.innerHTML && el.innerHTML !== '<p><br></p>'))) return;
    if (force) this._touched = false;
    if (el.innerHTML !== this._pending) el.innerHTML = this._pending;
    const w = this.count(el);
    if (w !== this.state.words) this.setState({ words: w });
  }
  count(el) { return el ? (el.innerText || '').replace(/\s+/g, '').length : 0; }

  toast(t) { clearTimeout(this._t); this.setState({ toast: t }); this._t = setTimeout(() => this.setState({ toast: null }), 1800); }

  save = () => {
    if (this.state.fileIdx === null) { this.setState({ fileIdx: 0, dirty: false }); this.toast('已保存到 ' + FILES[0].path); return; }
    this.setState({ dirty: false });
    this.toast('已保存 · ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }));
  };
  newDoc = () => { this.setState({ fileIdx: null, dirty: false, recentOpen: false }); this.seed(null); this.toast('新文档'); };
  openFile = (i) => { this.setState({ fileIdx: i, dirty: false, recentOpen: false, sel: 0 }); this.seed(FILES[i].title); };

  onKey = (e) => {
    const open = this.state.recentOpen;
    if (open && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter' || e.key === 'Escape')) {
      e.preventDefault();
      if (e.key === 'Escape') this.setState({ recentOpen: false });
      else if (e.key === 'ArrowDown') this.setState(s => ({ sel: Math.min(s.sel + 1, FILES.length - 1) }));
      else if (e.key === 'ArrowUp') this.setState(s => ({ sel: Math.max(s.sel - 1, 0) }));
      else this.openFile(this.state.sel);
      return;
    }
    if (!(e.metaKey || e.ctrlKey)) return;
    const k = e.key.toLowerCase();
    if (k === 's') { e.preventDefault(); this.save(); }
    else if (k === 'n') { e.preventDefault(); this.newDoc(); }
    else if (k === 'o') { e.preventDefault(); this.setState(s => ({ recentOpen: !s.recentOpen, sel: 0 })); }
    else if (/^[1-4]$/.test(e.key)) { e.preventDefault(); this.openFile(Number(e.key) - 1); }
  };

  onInput = () => { this._touched = true; this.setState({ dirty: true, words: this.count(this._docEl) }); };

  renderVals() {
    const measure = this.props.measure ?? 66;
    const bodySize = this.props.bodySize ?? 18;
    const dirtyMark = this.props.dirtyMark ?? '*';
    const file = this.state.fileIdx === null ? null : FILES[this.state.fileIdx];
    const empty = file === null && this.state.words === 0;

    const rowStyle = {
      display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 20,
      padding: '11px 0', border: 'none', borderBottom: '1px solid #F2EEE4', background: 'transparent',
      cursor: 'pointer', textAlign: 'left', fontFamily: 'inherit', color: '#2E2A24'
    };

    const decorate = (f, i) => {
      const on = i === this.state.sel;
      return {
        name: f.name, meta: f.meta,
        open: () => this.openFile(i),
        hover: () => this.setState({ sel: i }),
        rowStyle,
        panelRowStyle: {
          display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 14, width: '100%',
          padding: '7px 12px', borderRadius: 5, border: 'none', cursor: 'pointer', textAlign: 'left',
          background: on ? '#F0ECE2' : 'transparent', fontFamily: 'inherit'
        },
        panelNameStyle: { fontSize: 14, color: on ? '#2E2A24' : '#555047' }
      };
    };

    return {
      measure, bodySize,
      sheetStyle: { width: '100%', maxWidth: measure + 'ch', display: 'flex', flexDirection: 'column' },
      proseStyle: {
        fontFamily: "'Source Serif 4', 'Songti SC', serif", fontSize: bodySize + 'px',
        lineHeight: 1.8, color: '#2E2A24', paddingBottom: 60, minHeight: empty ? 0 : 40, textWrap: 'pretty'
      },
      titleBtn: {
        display: 'flex', alignItems: 'center', gap: 5, padding: '2px 8px', borderRadius: 4, border: 'none',
        background: this.state.recentOpen ? '#F0ECE2' : 'transparent', cursor: 'pointer', color: '#3A352E', fontFamily: 'inherit'
      },
      fileNameStar: (file ? file.name : '未命名') + (this.state.dirty ? ' ' + dirtyMark : ''),
      words: this.state.words,
      editable: true, onInput: this.onInput, docRef: this.docRef,
      showEmpty: empty,
      recent: FILES.map(decorate),
      showRecent: this.state.recentOpen,
      closeRecent: () => this.setState({ recentOpen: false }),
      toggleRecent: () => this.setState(s => ({ recentOpen: !s.recentOpen, sel: 0 })),
      showToast: !!this.state.toast, toastText: this.state.toast || ''
    };
  }
}
</script>
</body>
</html>
